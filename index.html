<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1B2560">
<title>Tajweed — App-Vorschau</title>
<style>
/* ==========================================================================
   Vorschau auf die App. Die Aufgaben kommen aus den JSON-Dateien unter json/,
   dieselben, die auch ausgeliefert werden — die Seite hält keine eigene Kopie.
   Gestaltung und Farben wie im Aufgabenbrowser (browser/), damit beide Seiten
   sichtbar zum selben Produkt gehören.
   ========================================================================== */
@font-face{
  font-family:'Hafs';
  src:url('fonts/hafs-uthmanic.woff2') format('woff2');
  font-weight:normal;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'AyahMark';
  src:url('fonts/amiri-quran-arabic-400-normal.woff2') format('woff2');
  font-weight:normal;font-style:normal;font-display:swap;
}

:root{
  --ground:#F4F0EB; --surface:#FFFFFF; --surface-2:#E9E8F1; --surface-3:#F3E9DD;
  --ink:#363636; --ink-2:#6D6D6D; --ink-3:#9B9B9F;
  --line:#D5D4DF; --line-strong:#C1C0C9;
  --accent:#26247B; --accent-soft:#D0CCF0; --accent-ink:#FFFFFF; --ring:#5A5595;
  --gold:#B99F6F; --gold-soft:#E4DCC9; --teal:#00AAAD;
  --ok:#4E8A56; --ok-line:#63C36F; --ok-bg:#E9F1EE;
  --mark:#936515; --mark-line:#D19F49; --mark-bg:#F8F1DA;
  --radius:1rem; --radius-pill:9999px;
  --shadow:0 1px 2px rgba(54,54,54,.06), 0 10px 28px -20px rgba(38,36,123,.30);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);
  background:
    radial-gradient(1100px 620px at 22% -10%, #FFFFFF 0%, rgba(255,255,255,0) 62%),
    radial-gradient(900px 700px at 105% 110%, var(--surface-3) 0%, rgba(243,233,221,0) 60%),
    var(--ground);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',sans-serif;
  font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
.ar{font-family:'Hafs','Traditional Arabic','Scheherazade New','Amiri',serif;direction:rtl;unicode-bidi:isolate}
.ayah{font-family:'AyahMark','Hafs','Amiri Quran',serif;white-space:nowrap;padding-inline-start:.12em}
mark.hit{background:var(--mark-bg);color:var(--mark);border-radius:5px;padding:0 1px;
  box-shadow:0 0 0 1px var(--mark-line) inset}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ==========================================================================
   Bühne: Leiste links, Handy in der Mitte
   ========================================================================== */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}

.rail{
  display:flex;flex-direction:column;gap:18px;
  padding:22px 18px 26px;border-right:1px solid var(--line);
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
  height:100vh;position:sticky;top:0;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .glyph{font-family:'Hafs','Amiri',serif;font-size:26px;line-height:1;color:var(--accent)}
.brand h1{margin:0;font-size:14px;font-weight:600;flex:1}
.dl{
  flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--line);
  transition:color .13s,border-color .13s,background .13s;
}
.dl:hover{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.dl[data-state="laeuft"]{color:var(--accent);border-color:var(--accent)}
.dl[data-state="fertig"]{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.brand .sub{display:block;font-size:11px;font-weight:400;color:var(--ink-3);letter-spacing:.03em}

.ctl{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--surface);
     border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.ctl .cap{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

.seg{display:flex;gap:4px;padding:3px;background:var(--surface-2);border-radius:var(--radius-pill)}
.seg button{
  flex:1;padding:6px 0;border-radius:var(--radius-pill);font-size:12px;font-weight:600;
  color:var(--ink-2);transition:background .15s,color .15s;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.07)}

.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{
  flex:none;width:40px;height:23px;border-radius:var(--radius-pill);
  background:var(--line-strong);position:relative;transition:background .18s;
}
.track::after{
  content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .18s;
}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(17px)}
.switch input:focus-visible + .track{outline:2px solid var(--ring);outline-offset:2px}

.lessons{display:flex;flex-direction:column;gap:14px;flex:1}
.block{display:flex;flex-direction:column;gap:3px}
.block > .cap{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:0 8px 4px;font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.block > .cap b{font-weight:600;letter-spacing:0;text-transform:none;font-size:11px;color:var(--ink-3)}
.lesson{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;
  border-radius:10px;text-align:left;transition:background .12s;
}
.lesson:hover{background:var(--surface-2)}
.lesson .no{
  flex:none;width:22px;height:22px;border-radius:7px;background:var(--accent-soft);
  color:var(--accent);font-size:11px;font-weight:600;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;
}
.lesson .tt{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.lesson[aria-current="true"] .no{background:rgba(255,255,255,.28);color:#fff}
.lesson[aria-current="true"] .tt{color:#fff;font-weight:600}

.railfoot{padding:0 6px;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.railfoot a{color:var(--accent);text-decoration:none;font-weight:600}
.railfoot a:hover{text-decoration:underline}

/* ==========================================================================
   Handy
   ========================================================================== */
.stage{display:grid;place-items:center;padding:32px 24px}
.device{transform:scale(var(--scale,1));transform-origin:center center}
.phone{
  position:relative;width:392px;height:812px;padding:11px;border-radius:56px;
  background:linear-gradient(150deg,#54545c 0%,#1c1c20 26%,#0d0d10 55%,#2f2f36 100%);
  box-shadow:0 2px 3px rgba(0,0,0,.5), 0 42px 80px -28px rgba(20,18,60,.55),
             inset 0 0 0 1.5px rgba(255,255,255,.10);
}
/* Tasten */
.phone::before,.phone::after{content:"";position:absolute;width:3px;border-radius:3px;
  background:linear-gradient(180deg,#3a3a42,#17171b)}
.phone::before{left:-3px;top:168px;height:64px}
.phone::after{left:-3px;top:246px;height:64px}
.btn-power{position:absolute;right:-3px;top:206px;width:3px;height:96px;border-radius:3px;
  background:linear-gradient(180deg,#3a3a42,#17171b)}

.screen{
  position:relative;width:100%;height:100%;border-radius:45px;overflow:hidden;
  background:var(--surface);display:flex;flex-direction:column;
}
.island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:104px;height:30px;border-radius:16px;background:#08080a;z-index:9;
}
.island::after{content:"";position:absolute;right:9px;top:9px;width:11px;height:11px;
  border-radius:50%;background:#16161c;box-shadow:inset 0 0 0 1px #2a2a34}

.statusbar{
  flex:none;height:52px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 6px;font-size:12.5px;font-weight:600;letter-spacing:.01em;
}
.bars{display:flex;align-items:flex-end;gap:5px}
.bars i{display:block;width:15px;height:11px;
  background:linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 4px,var(--ink) 4px 7px,
             transparent 7px 8px,var(--ink) 8px 11px,transparent 11px 12px,var(--ink) 12px 15px);
  -webkit-mask:linear-gradient(0deg,#000 0 100%);border-radius:1px}
.batt{width:24px;height:12px;border:1.4px solid var(--ink);border-radius:3.5px;position:relative;opacity:.9}
.batt::before{content:"";position:absolute;inset:1.6px;background:var(--ink);border-radius:1.5px;width:72%}
.batt::after{content:"";position:absolute;right:-3.4px;top:3.4px;width:2px;height:4px;
  background:var(--ink);border-radius:0 1.5px 1.5px 0;opacity:.7}

.appbar{
  flex:none;display:flex;align-items:center;gap:10px;padding:2px 18px 10px;
}
.appbar .nav{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface-2);color:var(--ink-2);font-size:15px;flex:none;
}
.appbar .nav[disabled]{opacity:.35;cursor:default}
.appbar .mid{flex:1;min-width:0;text-align:center}
.appbar .mid .l1{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.appbar .mid .l2{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar .count{flex:none;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

.progress{flex:none;height:4px;margin:0 18px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .25s}

.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 20px}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

.q{margin:2px 0 14px;font-size:15.5px;font-weight:600;line-height:1.45}
.q .pat{
  font-family:'Hafs','Amiri',serif;font-size:16px;background:var(--surface-2);
  border-radius:7px;padding:1px 7px;font-weight:400;display:inline-block;
}
.q .sep{color:var(--ink-3);font-weight:400}

.card{
  background:var(--surface-3);border:1px solid var(--gold-soft);border-radius:var(--radius);
  padding:18px 16px 14px;margin-bottom:14px;text-align:center;
}
.card .subject{margin:0;font-size:30px;line-height:2.05;letter-spacing:.01em}
.card .subject.verse{font-size:23px;line-height:2.2}

.card .src{margin-top:12px}

.play{
  display:inline-flex;align-items:center;gap:9px;margin-top:12px;padding:9px 18px 9px 14px;
  border-radius:var(--radius-pill);background:var(--accent);color:var(--accent-ink);
  font-size:13px;font-weight:600;box-shadow:var(--shadow);
}
.play .tri{font-size:11px;line-height:1}
.play[data-state="missing"]{background:var(--surface-2);color:var(--ink-3);box-shadow:none}

.opts{display:flex;flex-direction:column;gap:9px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  text-align:left;transition:border-color .13s,background .13s;
}
.opt:hover{border-color:var(--line-strong)}
.opt .box{
  flex:none;width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;font-size:11px;color:transparent;
}
.opt.round .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .tx{flex:1;min-width:0;font-size:14px}
.opt .tx.arabic{font-family:'Hafs','Amiri',serif;font-size:21px;direction:rtl;text-align:right;line-height:1.9}
.opt .tx.glyph{font-family:'Hafs','Amiri',serif;font-size:23px;text-align:center}
.opt.wide{grid-column:1/-1}
.opt .tag{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.opt.right{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.right .box{border-color:var(--ok-line)}

/* Vers markieren */
.verse-pick{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 14px;font-size:23px;line-height:2.25;text-align:center;
}
.verse-pick w{cursor:pointer;border-radius:7px;padding:1px 3px;transition:background .12s}
.verse-pick w:hover{background:var(--surface-2)}
.verse-pick w.picked{background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.verse-pick w.right{background:var(--ok-bg);box-shadow:0 0 0 1px var(--ok-line) inset}
.versefoot{text-align:center;margin-top:12px}
.versefoot .src{margin-top:10px}
.card .src,.versefoot .src{font-size:11px;color:var(--ink-3);letter-spacing:.03em}
.hintline{margin:12px 2px 0;font-size:11.5px;color:var(--ink-3);text-align:center}

/* Zuordnung */
.pair{background:var(--surface);border:1px solid var(--line);border-radius:14px;
      padding:12px 13px;margin-bottom:10px}
.pair .w{font-family:'Hafs','Amiri',serif;font-size:21px;direction:rtl;text-align:right;line-height:1.9}
.pair .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{
  padding:6px 12px;border-radius:var(--radius-pill);border:1.5px solid var(--line);
  font-family:'Hafs','Amiri',serif;font-size:17px;line-height:1.5;background:var(--surface);
}
.chip.latin{font-family:inherit;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.right{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}

.appfoot{flex:none;padding:10px 18px 26px;border-top:1px solid var(--line);background:var(--surface)}
.next{
  width:100%;padding:14px;border-radius:16px;background:var(--accent);color:var(--accent-ink);
  font-size:15px;font-weight:600;box-shadow:var(--shadow);transition:filter .13s;
}
.next:hover{filter:brightness(1.12)}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:132px;height:5px;border-radius:3px;background:var(--ink);opacity:.22;z-index:9}

.done{padding:46px 10px;text-align:center}
.done .big{font-size:34px}
.done p{margin:12px 0 18px;color:var(--ink-2)}
.done button{padding:11px 22px;border-radius:var(--radius-pill);border:1.5px solid var(--line);
             font-size:13px;font-weight:600}
.loading{padding:60px 10px;text-align:center;color:var(--ink-3);font-size:13px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="glyph">تجويد</span>
      <h1>Tajweed<span class="sub" id="brandSub">App-Vorschau</span></h1>
      <button type="button" class="dl" id="download" title="Alle Aufgaben als JSON herunterladen">
        <svg viewBox="0 0 20 20" aria-hidden="true" width="17" height="17">
          <path d="M10 2.6v9.2M6.2 8.4 10 12.2l3.8-3.8M3.6 14.4v1.2a1.8 1.8 0 0 0 1.8 1.8h9.2a1.8 1.8 0 0 0 1.8-1.8v-1.2"
                fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="ctl">
      <div class="cap" id="capView">Ansicht</div>
      <div class="seg" role="group" aria-label="Sprache">
        <button type="button" data-lang="de" aria-pressed="true">Deutsch</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <label class="switch">
        <input type="checkbox" id="solve">
        <span class="track" aria-hidden="true"></span>
        <span id="solveLabel">Lösungen anzeigen</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="advTafkheem">
        <span class="track" aria-hidden="true"></span>
        <span id="advTafkheemLabel">Tafkheem fortgeschritten</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="advQalqala">
        <span class="track" aria-hidden="true"></span>
        <span id="advQalqalaLabel">Qalqalah fortgeschritten</span>
      </label>
    </div>

    <nav class="lessons" id="lessons" aria-label="Lektionen"></nav>

    <div class="railfoot" id="railfoot"></div>
  </aside>

  <main class="stage">
    <div class="device" id="device">
      <div class="phone">
        <span class="btn-power" aria-hidden="true"></span>
        <div class="screen">
          <div class="island" aria-hidden="true"></div>
          <div class="statusbar" aria-hidden="true">
            <span>9:41</span>
            <span class="bars"><i></i><span class="batt"></span></span>
          </div>
          <div class="appbar">
            <button type="button" class="nav" id="prev" aria-label="Zurück">‹</button>
            <div class="mid">
              <div class="l1" id="barRule">—</div>
              <div class="l2" id="barTitle">—</div>
            </div>
            <span class="count" id="barCount"></span>
          </div>
          <div class="progress"><i id="bar" style="width:0%"></i></div>
          <div class="scroll" id="screen"><div class="loading">…</div></div>
          <div class="appfoot"><button type="button" class="next" id="next">Weiter</button></div>
          <div class="homebar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
"use strict";

/* ==========================================================================
   Lehrplan
   ========================================================================== */
const BLOCKS = [
  {file:"tafkheem",     von: 1, bis: 9, name:"Tafkheem"},
  {file:"qalqala",      von:10, bis:14, name:"Qalqalah"},
  {file:"idgham",       von:15, bis:21, name:"Idgham"},
  {file:"ikhfa-idgham", von:22, bis:26, name:"Ikhfa & Idgham"},
  {file:"iqlab",        von:27, bis:28, name:"Iqlab"},
  {file:"madd",         von:29, bis:34, name:"Madd"},
  {file:"waqf",         von:35, bis:40, name:"Waqf"}
];

const LESSONS = {
   1:{de:"Qaf ق und Kaf ك",            en:"Qaf ق and Kaf ك"},
   2:{de:"Ta ط und Ta ت",              en:"Ta ط and Ta ت"},
   3:{de:"Kha خ und Ha ح",             en:"Kha خ and Ha ح"},
   4:{de:"Ghayn غ und Ha ه",           en:"Ghayn غ and Ha ه"},
   5:{de:"Dad ض und Dal د",            en:"Dad ض and Dal د"},
   6:{de:"Dha ظ und Dhal ذ",           en:"Dha ظ and Dhal ذ"},
   7:{de:"Sad ص und Seen س",           en:"Sad ص and Seen س"},
   8:{de:"Regeln des Ra ر",            en:"Rules of the Ra ر"},
   9:{de:"Der Name Allah",             en:"The name Allah"},
  10:{de:"Dal د und Dad ض",            en:"Dal د and Dad ض"},
  11:{de:"Ba ب",                       en:"Ba ب"},
  12:{de:"Jeem ج",                     en:"Jeem ج"},
  13:{de:"Qaf ق und Kaf ك",            en:"Qaf ق and Kaf ك"},
  14:{de:"Ta ط und Ta ت",              en:"Ta ط and Ta ت"},
  15:{de:"Gleiche Buchstaben",         en:"Identical letters"},
  16:{de:"Ähnliche Buchstaben",        en:"Similar letters"},
  17:{de:"Noon vor Lam und Ra",        en:"Noon before Lam and Ra"},
  18:{de:"Tanween vor Lam und Ra",     en:"Tanween before Lam and Ra"},
  19:{de:"Noon und Tanween vor Noon",  en:"Noon and Tanween before Noon"},
  20:{de:"Noon und Tanween vor Waw",   en:"Noon and Tanween before Waw"},
  21:{de:"Noon und Tanween vor Ya",    en:"Noon and Tanween before Ya"},
  22:{de:"Noon sakin vor 15 Buchstaben", en:"Noon sakin before 15 letters"},
  23:{de:"Tanween vor 15 Buchstaben",  en:"Tanween before 15 letters"},
  24:{de:"Meem vor Meem",              en:"Meem before Meem"},
  25:{de:"Noon und Tanween vor Meem",  en:"Noon and Tanween before Meem"},
  26:{de:"Meem vor Ba, Ba vor Meem",   en:"Meem before Ba, Ba before Meem"},
  27:{de:"Noon sakin vor Ba",          en:"Noon sakin before Ba"},
  28:{de:"Tanween vor Ba",             en:"Tanween before Ba"},
  29:{de:"Madd Muttasil",              en:"Madd Muttasil"},
  30:{de:"Madd Muttasil mit Waw und Ya", en:"Madd Muttasil with Waw and Ya"},

/* ==========================================================================
   Fragetext — die Formulierungen stehen in questions.json, nicht hier
   ==========================================================================
   Jede Aufgabe nennt nur ihre question_id; den Text dazu bearbeitet der
   Lehrer über fragen/. {rule} wird zum Namen der Regel, {sign} zum
   Halt-Zeichen der Aufgabe. */
let FRAGEN = null;

function questionText(x, l){
  const e = FRAGEN && FRAGEN[x.question_id];
  if (!e) return esc(x.question_id || x.question_type || "");
  return esc(e[l] || e.de)
    .split("{rule}").join(esc(RULE[x.rule]))
    .split("{sign}").join(patternHTML(x.pattern));
}

/* ==========================================================================
   Hilfen
   ========================================================================== */
const COMBINING = /[ؐ-ًؚ-ٰٟۖ-ۭ]/;
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el = (t, cls, html) => { const n = document.createElement(t);
  if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

/* Ein alleinstehendes Vokalzeichen braucht einen Trägerkreis. */
function displayGlyph(t){
  return (t && t.length <= 2 && [...t].every(c => COMBINING.test(c))) ? "◌" + t : t;
}
function patternHTML(p){
  if (!p) return "";
  return p.split(":").map(s => `<span class="pat">${esc(displayGlyph(s))}</span>`)
          .join(' <span class="sep">/</span> ');
}
/* Indische Ziffern am Wortende sind die Versnummer: U+06DD davor. */
const AYAH_TAIL = /[٠-٩۰-۹]+$/;
function ayahSplit(text){
  const s = String(text == null ? "" : text), m = s.match(AYAH_TAIL);
  if (!m) return [s, ""];
  return [s.slice(0, m.index).replace(/[\s ]+$/, ""),
          ' <span class="ayah">۝' + esc(m[0]) + "</span>"];
}
/* „spots" nennt die Zeichenspannen, an denen die Regel greift. */
function spotHTML(text, spots, zeigen){
  const parts = ayahSplit(text), stem = parts[0], ayah = parts[1];
  if (!zeigen || !spots || !spots.length) return esc(stem) + ayah;
  let out = "", cur = 0;
  for (const s of spots){
    const a = Math.max(cur, Math.min(s.start, stem.length));
    const b = Math.min(s.end, stem.length);
    if (b <= a) continue;
    out += esc(stem.slice(cur, a)) + '<mark class="hit">' + esc(stem.slice(a, b)) + "</mark>";
    cur = b;
  }
  return out + esc(stem.slice(cur)) + ayah;
}
function optLabel(raw, x, l){
  const t = T[l];
  if (raw === "none")
    return x.question_type === "identify_waqf_sign" ? t.optNoneTwo
         : (x.task_type === "match" || x.task_type === "matching") ? t.optNoneWords
         : t.optNone;
  if (raw === "-") return t.dash;
  return ({yes:t.yes, no:t.no, start:t.start, mid:t.mid, end:t.end})[raw] || null;
}

const store = {
  get(k, fb){ try { const v = localStorage.getItem(k); return v === null ? fb : v; }
              catch(e){ return fb; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const S = {
  lang: (function(){
    const g = store.get("tajwid.lang", "");
    if (g === "en" || g === "de") return g;
    return /^en\b/i.test(navigator.language || "") ? "en" : "de";   // beim ersten Besuch
  })(),
  solve: store.get("tajwid.solve", "0") === "1",
  /* Für Fortgeschrittene sind die Lektionen zusammengefasst — das ist der
     Normalfall, wer den Stoff neu lernt, schaltet es ab. */
  advTafkheem: store.get("tajwid.advTafkheem", "1") === "1",
  advQalqala: store.get("tajwid.advQalqala", "1") === "1",
  /* Gemerkt wird ein Schlüssel, keine Nummer: die Nummer verschiebt sich,
     sobald ein Schalter umgelegt wird. */
  schluessel: store.get("tajwid.lesson", "L1"),
  i: 0, aufgaben: [], picked: new Set(), pairs: {}
};
const cache = new Map();
let FORT = null;          // die zusammengefassten Lektionen aus advanced.json

const $ = id => document.getElementById(id);

/* ==========================================================================
   Lektionsliste — hängt davon ab, was zusammengefasst ist
   ========================================================================== */
function blockOf(n){ return BLOCKS.find(b => n >= b.von && n <= b.bis); }

function fortAktiv(){
  return (FORT || []).filter(f => (f.group === "tafkheem" && S.advTafkheem)
                              || (f.group === "qalqala" && S.advQalqala));
}

/* Die Liste, wie sie links steht: entweder eine Lektion des Lehrplans oder
   eine zusammengefasste, die mehrere davon ersetzt. Durchnummeriert wird
   fortlaufend, damit aus 1–7 die neue Lektion 1 wird und die alte 8 zur 2. */
function lektionsliste(){
  const zusammen = fortAktiv();
  const aus = [];
  let alt = 1, nr = 1;
  while (alt <= 40){
    const hier = zusammen.filter(f => f.replaces[0] === alt);
    if (hier.length){
      for (const f of hier)
        aus.push({nr: nr++, key: f.id, fort: f, block: f.block,
                  titel: l => f[l], quelle: f.replaces});
      alt = hier[0].replaces[hier[0].replaces.length - 1] + 1;
    } else {
      const n = alt;
      aus.push({nr: nr++, key: "L" + n, lesson: n, block: blockOf(n).file,
                titel: l => LESSONS[n][l], quelle: [n]});
      alt++;
    }
  }
  return aus;
}

function aktuelle(liste){
  return liste.find(e => e.key === S.schluessel) || liste[0];
}

function drawRail(){
  const l = S.lang, t = T[l];
  document.documentElement.lang = t.htmlLang;
  document.title = l === "de" ? "Tajweed — App-Vorschau" : "Tajweed — app preview";
  $("brandSub").textContent = t.sub;
  $("capView").textContent = t.view;
  $("solveLabel").textContent = t.solve;
  $("advTafkheemLabel").textContent = t.advTafkheem;
  $("advQalqalaLabel").textContent = t.advQalqala;
  $("download").title = t.download;
  $("next").textContent = t.next;
  $("prev").setAttribute("aria-label", t.back);
  $("railfoot").innerHTML = t.footer;
  document.querySelectorAll(".seg button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === l)));

  const liste = lektionsliste(), hier = aktuelle(liste);
  const nav = $("lessons");
  nav.innerHTML = "";
  let aktiv = null, box = null, offen = null;
  for (const e of liste){
    if (e.block !== offen){
      offen = e.block;
      const b = BLOCKS.find(b => b.file === e.block);
      const gleich = liste.filter(x => x.block === e.block);
      const spanne = gleich.length > 1
        ? `${gleich[0].nr}–${gleich[gleich.length - 1].nr}` : String(gleich[0].nr);
      box = el("div", "block");
      box.append(el("div", "cap", `<span>${esc(b.name)}</span><b>${spanne}</b>`));
      nav.append(box);
    }
    const btn = el("button", "lesson",
      `<span class="no">${e.nr}</span><span class="tt">${esc(e.titel(l))}</span>`);
    btn.type = "button";
    btn.setAttribute("aria-current", String(e.key === hier.key));
    if (e.fort) btn.title = (l === "de" ? "Fasst Lektion " : "Covers lessons ")
      + e.quelle[0] + "–" + e.quelle[e.quelle.length - 1] + (l === "de" ? " zusammen" : "");
    btn.addEventListener("click", () => openLesson(e.key));
    if (e.key === hier.key) aktiv = btn;
    box.append(btn);
  }
  if (aktiv) aktiv.scrollIntoView({block: "nearest"});
}

/* ==========================================================================
   Aufgaben laden
   ========================================================================== */
async function ladeFragen(){
  try {
    const r = await fetch("questions.json");
    const d = await r.json();
    FRAGEN = Object.fromEntries(d.questions.map(q => [q.id, q]));
  } catch (e){ FRAGEN = {}; }
}

async function ladeFort(){
  try {
    const r = await fetch("advanced.json");
    FORT = (await r.json()).lessons;
  } catch (e){ FORT = []; }
}

async function loadBlock(file){
  if (cache.has(file)) return cache.get(file);
  const p = fetch(`json/${file}.json`).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
  cache.set(file, p);
  return p;
}

async function openLesson(key){
  if (!FRAGEN) await ladeFragen();
  if (!FORT) await ladeFort();
  S.schluessel = key;
  store.set("tajwid.lesson", key);
  drawRail();
  const e = aktuelle(lektionsliste());
  S.schluessel = e.key;
  $("screen").innerHTML = `<div class="loading">${esc(T[S.lang].loading)}</div>`;
  try {
    const alle = await loadBlock(e.block);
    if (S.schluessel !== e.key) return;
    if (e.fort){
      /* Die zusammengefasste Lektion nennt ihre Aufgaben einzeln und in der
         Reihenfolge, in der sie drankommen sollen. */
      const nach = new Map(alle.map(x => [x.id, x]));
      S.aufgaben = e.fort.tasks.map(i => nach.get(i)).filter(Boolean);
    } else {
      S.aufgaben = alle.filter(x => x.lesson === e.lesson);
    }
    S.i = 0;
    draw();
  } catch (err){
    $("screen").innerHTML = `<div class="loading">${esc(T[S.lang].failed)}</div>`;
  }
}

/* ==========================================================================
   Handybildschirm
   ========================================================================== */
function draw(){
  const l = S.lang, t = T[l], scr = $("screen");
  scr.scrollTop = 0;
  S.picked = new Set();
  S.pairs = {};

  const hier = aktuelle(lektionsliste());
  $("barTitle").textContent = `${t.lesson} ${hier.nr} · ${hier.titel(l)}`;
  const fertig = S.i >= S.aufgaben.length;
  $("barCount").textContent = S.aufgaben.length
    ? `${Math.min(S.i + 1, S.aufgaben.length)} ${t.of} ${S.aufgaben.length}` : "";
  $("bar").style.width = S.aufgaben.length
    ? (100 * (fertig ? S.aufgaben.length : S.i) / S.aufgaben.length) + "%" : "0%";
  $("prev").disabled = S.i === 0;

  if (fertig){
    $("barRule").textContent = "—";
    scr.innerHTML = "";
    const d = el("div", "done",
      `<div class="big">✓</div><h3>${esc(t.doneTitle)}</h3><p>${esc(t.doneText)}</p>`);
    const again = el("button", null, esc(t.again));
    again.type = "button";
    again.addEventListener("click", () => { S.i = 0; draw(); });
    d.append(again);
    scr.append(d);
    return;
  }

  const x = S.aufgaben[S.i];
  const zeigen = S.solve;
  $("barRule").textContent = RULE[x.rule];
  scr.innerHTML = "";
  scr.append(el("h2", "q", questionText(x, l)));

  const subj = x.subject && x.subject.text;
  const istVorgabe = subj === "اختر";
  const markieren = x.task_type === "mark_verse";

  if (subj && !istVorgabe && !markieren){
    const lang = ayahSplit(subj)[0].trim().split(/\s+/).length > 3;
    const card = el("div", "card");
    card.append(el("p", "subject ar" + (lang ? " verse" : ""),
      spotHTML(subj, x.subject.spots, zeigen)));
    if (x.subject.audio) card.append(audioBtn(x.subject.audio, t));
    card.append(el("div", "src", x.sura ? `${t.sura} ${x.sura} : ${x.verse}` : t.word));
    scr.append(card);
  }

  if (markieren)          scr.append(verseEl(x, t, zeigen));
  else if (x.task_type === "matching") scr.append(pairsEl(x, l, t, zeigen));
  else                    scr.append(optsEl(x, l, t, zeigen));
}

function audioBtn(file, t){
  const b = el("button", "play", `<span class="tri">▶</span>${esc(t.listen)}`);
  b.type = "button";
  b.addEventListener("click", () => {
    const a = new Audio("audio/" + file);
    a.addEventListener("error", () => {
      b.dataset.state = "missing";
      b.innerHTML = `<span class="tri">▪</span>${esc(t.noAudio)}`;
    });
    a.play().catch(() => {
      b.dataset.state = "missing";
      b.innerHTML = `<span class="tri">▪</span>${esc(t.noAudio)}`;
    });
  });
  return b;
}

function optsEl(x, l, t, zeigen){
  const richtig = new Set((x.answer || []).filter(a => typeof a === "number"));
  const mehrfach = x.multiple === true || x.task_type === "match";
  const kurz = (x.options || []).filter(o => o.text !== "none")
    .every(o => (o.text || "").length <= 3);
  const wrap = el("div", "opts" + (kurz ? " grid" : ""));

  (x.options || []).forEach(o => {
    const raw = o.text == null ? "" : o.text;
    const label = optLabel(raw, x, l);
    const glyph = !label && raw.length <= 2 && [...raw].every(c => COMBINING.test(c));
    const arab = !label && !glyph && /[؀-ۿ]/.test(raw);

    const b = el("button", "opt" + (mehrfach ? "" : " round")
                          + (raw === "none" ? " wide" : ""));
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.append(el("span", "box", mehrfach ? "✓" : "●"));
    const tx = el("div", "tx" + (glyph ? " glyph" : arab ? " arabic" : ""));
    if (label) tx.textContent = label;
    else tx.innerHTML = arab ? spotHTML(raw, o.spots, zeigen) : esc(displayGlyph(raw));
    b.append(tx);
    if (zeigen && richtig.has(o.id)){
      b.classList.add("right");
      b.append(el("span", "tag", esc(t.correct)));
    }
    b.addEventListener("click", () => {
      if (mehrfach){
        const an = b.getAttribute("aria-pressed") === "true";
        b.setAttribute("aria-pressed", String(!an));
      } else {
        wrap.querySelectorAll(".opt").forEach(n => n.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
      }
    });
    wrap.append(b);
  });
  return wrap;
}

/* Vers markieren: der Lernende tippt Wörter an; mit „Lösungen anzeigen"
   leuchten die Wörter auf, die eine Fundstelle enthalten. */
function verseEl(x, t, zeigen){
  const box = el("div");
  const text = x.subject.text;
  const parts = ayahSplit(text), stem = parts[0], ayah = parts[1];
  const spots = (x.subject.spots || []);
  const p = el("div", "verse-pick ar");
  const re = /\S+/g;
  let m, cur = 0, html = "";
  while ((m = re.exec(stem)) !== null){
    const a = m.index, b = a + m[0].length;
    const treffer = spots.some(s => s.start < b && s.end > a);
    html += esc(stem.slice(cur, a));
    html += `<w data-a="${a}"${zeigen && treffer ? ' class="right"' : ""}>${esc(m[0])}</w>`;
    cur = b;
  }
  p.innerHTML = html + esc(stem.slice(cur)) + ayah;
  p.addEventListener("click", ev => {
    const w = ev.target.closest("w");
    if (w) w.classList.toggle("picked");
  });
  box.append(p);
  const foot = el("div", "versefoot");
  if (x.subject.audio) foot.append(audioBtn(x.subject.audio, t));
  foot.append(el("div", "src", x.sura ? `${t.sura} ${x.sura} : ${x.verse}` : t.word));
  box.append(foot, el("div", "hintline", esc(t.tapVerse)));
  return box;
}

/* Zuordnung: zu jedem Wort das passende Muster antippen. */
function pairsEl(x, l, t, zeigen){
  const box = el("div");
  const soll = {};
  (x.answer || []).forEach(pp => { soll[pp.item] = pp.option; });
  (x.items || []).forEach(it => {
    const row = el("div", "pair");
    row.append(el("div", "w", spotHTML(it.text, it.spots, zeigen)));
    const chips = el("div", "chips");
    (x.options || []).forEach(o => {
      const label = optLabel(o.text, x, l);
      const c = el("button", "chip" + (label ? " latin" : ""),
                   label ? esc(label) : esc(displayGlyph(o.text)));
      c.type = "button";
      c.setAttribute("aria-pressed", "false");
      if (zeigen && soll[it.id] === o.id) c.classList.add("right");
      c.addEventListener("click", () => {
        chips.querySelectorAll(".chip").forEach(n => n.setAttribute("aria-pressed", "false"));
        c.setAttribute("aria-pressed", "true");
      });
      chips.append(c);
    });
    row.append(chips);
    box.append(row);
  });
  box.append(el("div", "hintline", esc(t.tapPairs)));
  return box;
}

/* ==========================================================================
   Alles herunterladen
   ==========================================================================
   Ein ZIP ohne fremde Bibliothek: die Dateien werden unverändert abgelegt
   (Methode 0, „stored"), das spart den Packer und kostet bei JSON wenig.
   Aufbau je Datei ein lokaler Kopf, danach das zentrale Verzeichnis. */
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zip(dateien){
  const enc = new TextEncoder();
  const teile = [], verzeichnis = [];
  let offset = 0;
  for (const d of dateien){
    const name = enc.encode(d.name), daten = enc.encode(d.text);
    const summe = crc32(daten);
    const kopf = new DataView(new ArrayBuffer(30));
    kopf.setUint32(0, 0x04034b50, true);
    kopf.setUint16(4, 20, true);            // benötigte Fassung
    kopf.setUint16(6, 0x0800, true);        // Namen sind UTF-8
    kopf.setUint16(8, 0, true);             // unkomprimiert
    kopf.setUint32(14, summe, true);
    kopf.setUint32(18, daten.length, true);
    kopf.setUint32(22, daten.length, true);
    kopf.setUint16(26, name.length, true);
    teile.push(new Uint8Array(kopf.buffer), name, daten);

    const ve = new DataView(new ArrayBuffer(46));
    ve.setUint32(0, 0x02014b50, true);
    ve.setUint16(4, 20, true);
    ve.setUint16(6, 20, true);
    ve.setUint16(8, 0x0800, true);
    ve.setUint16(10, 0, true);
    ve.setUint32(16, summe, true);
    ve.setUint32(20, daten.length, true);
    ve.setUint32(24, daten.length, true);
    ve.setUint16(28, name.length, true);
    ve.setUint32(42, offset, true);
    verzeichnis.push(new Uint8Array(ve.buffer), name);
    offset += 30 + name.length + daten.length;
  }
  const vLaenge = verzeichnis.reduce((n, a) => n + a.length, 0);
  const ende = new DataView(new ArrayBuffer(22));
  ende.setUint32(0, 0x06054b50, true);
  ende.setUint16(8, dateien.length, true);
  ende.setUint16(10, dateien.length, true);
  ende.setUint32(12, vLaenge, true);
  ende.setUint32(16, offset, true);
  return new Blob([...teile, ...verzeichnis, new Uint8Array(ende.buffer)],
                  {type: "application/zip"});
}

async function herunterladen(){
  const knopf = $("download"), t = T[S.lang];
  knopf.dataset.state = "laeuft";
  knopf.title = t.packen;
  try {
    const namen = BLOCKS.map(b => `json/${b.file}.json`)
      .concat((FORT || []).map(f => `json/${f.id}.json`))
      .concat(["questions.json", "advanced.json"]);
    const dateien = await Promise.all(namen.map(async n => {
      const r = await fetch(n);
      if (!r.ok) throw new Error(n + ": " + r.status);
      return {name: n.replace("json/", "aufgaben/"), text: await r.text()};
    }));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(zip(dateien));
    a.download = "tajweed-aufgaben.zip";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    knopf.dataset.state = "fertig";
    setTimeout(() => { knopf.dataset.state = ""; knopf.title = t.download; }, 2200);
  } catch (e){
    knopf.dataset.state = "";
    knopf.title = t.failed;
  }
}
$("download").addEventListener("click", () => { if (!FORT) ladeFort().then(herunterladen); else herunterladen(); });

function fit(){
  const s = Math.min(1, (window.innerHeight - 56) / 812);
  $("device").style.setProperty("--scale", s.toFixed(3));
  $("device").style.height = (812 * s) + "px";
}
window.addEventListener("resize", fit);
