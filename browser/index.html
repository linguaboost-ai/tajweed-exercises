<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#1B2560">
<title>Tajweed Aufgabenbrowser</title>
<style>
/* ==========================================================================
   Theme: German Method brand tokens, taken from qsk-web/src/styles.css.
   Light values are qsk-web ":root"; dark values are its ".dark" block.
   Surface tints marked (abgeleitet) are derived — qsk-web has no equivalent.
   ========================================================================== */

/* Quran-Schrift des Produkts, liegt neben der Datei unter fonts/ */
@font-face{
  font-family:'Hafs';
  src:url('../fonts/hafs-uthmanic.woff2') format('woff2');
  font-weight:normal;font-style:normal;font-display:swap;
}

/* Ornament der Versnummer (U+06DD). Nur dieses eine Zeichen samt Ziffern
   kommt aus Amiri Quran, der restliche Text bleibt in der Hausschrift. */
@font-face{
  font-family:'AyahMark';
  src:url('../fonts/amiri-quran-arabic-400-normal.woff2') format('woff2');
  font-weight:normal;font-style:normal;font-display:swap;
}

:root{
  --ground:#F4F0EB;        /* background / base-1 */
  --surface:#FFFFFF;       /* card / neutral-1 */
  --surface-2:#E9E8F1;     /* muted / gray-1 */
  --surface-3:#F3E9DD;     /* base-2 */
  --ink:#363636;           /* foreground / neutral-7 */
  --ink-2:#6D6D6D;         /* muted-foreground / neutral-6 */
  --ink-3:#9B9B9F;         /* gray-5 */
  --line:#D5D4DF;          /* border / gray-2 */
  --line-strong:#C1C0C9;   /* gray-3 */
  --accent:#26247B;        /* primary-purple */
  --accent-soft:#D0CCF0;   /* primary-purple-light */
  --accent-ink:#FFFFFF;    /* primary-foreground */
  --ring:#5A5595;          /* primary-purple-dark */
  --gold:#B99F6F;          /* primary-gold */
  --gold-soft:#E4DCC9;     /* primary-gold-light */
  --teal:#00AAAD;          /* primary-teal */
  --ok:#4E8A56;            /* success-4 */
  --ok-line:#63C36F;       /* success-3 */
  --ok-bg:#E9F1EE;         /* success-1 */
  --bad:#8F1107;           /* error-4 */
  --bad-line:#CD5B52;      /* error-3 */
  --bad-bg:#F3E5EA;        /* error-1 */
  --mark:#936515;          /* warning-7 */
  --mark-line:#D19F49;     /* warning-6 */
  --mark-bg:#F8F1DA;       /* warning-1 */
  --radius:1rem;           /* --radius */
  --radius-input:.75rem;   /* --radius-input */
  --radius-pill:9999px;    /* --radius-xl */
  --shadow:0 1px 2px rgba(54,54,54,.06), 0 10px 28px -20px rgba(38,36,123,.30);
  color-scheme:light;
}
/* Hell ist der Standard (wie qsk-web, das light-only ausliefert).
   Dunkel nur auf ausdrücklichen Wunsch über den Ansicht-Schalter. */
:root[data-theme="dark"]{
  --ground:#2A2A2A; --surface:#363636; --surface-2:#454545; --surface-3:#3F3B33;
  --ink:#E6E6E6; --ink-2:#B6B6B6; --ink-3:#949494;
  --line:#6D6D6D; --line-strong:#949494;
  --accent:#D0CCF0; --accent-soft:#3B3A5C; --accent-ink:#26247B; --ring:#D0CCF0;
  --gold:#CAB691; --gold-soft:#4A4335; --teal:#AEDEE0;
  --ok:#C3F1C8; --ok-line:#4E8A56; --ok-bg:#2E4433;
  --bad:#FEBCB6; --bad-line:#CD5B52; --bad-bg:#4A2A28;
  --mark:#FFE58F; --mark-line:#D19F49; --mark-bg:#4A3E22;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}

/* Versnummer: Kartusche mit der Ziffer darin, mit Luft zum Wort davor */
.ayah{
  font-family:'AyahMark','Hafs','Amiri Quran','Amiri',serif;
  white-space:nowrap;
  padding-inline-start:.12em;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen','Ubuntu','Cantarell','Fira Sans','Droid Sans','Helvetica Neue',sans-serif;
  font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
/* entspricht .font-arabic in qsk-web */
.ar{font-family:'Hafs','Traditional Arabic','Scheherazade New','Amiri',serif;direction:rtl;unicode-bidi:isolate}
.mono{font-family:source-code-pro,Menlo,Monaco,Consolas,'Courier New',monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ==========================================================================
   Shell: Kopf / Filterdeck / (Liste + Detail)
   ========================================================================== */
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100vh}

/* ---------- Kopf ---------- */
.head{
  display:flex;align-items:center;gap:16px;padding:12px 22px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .glyph{font-family:'Hafs','Amiri',serif;font-size:23px;line-height:1;color:var(--accent)}
.mark h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.01em;white-space:nowrap}

.searchbox{position:relative;flex:1;max-width:400px}
.searchbox input{
  width:100%;padding:9px 34px 9px 14px;border:1px solid var(--line);
  border-radius:var(--radius-pill);background:var(--surface-2);color:var(--ink);
  font:inherit;font-size:13px;
}
.searchbox input::placeholder{color:var(--ink-3)}
a.ghost{text-decoration:none;display:inline-flex;align-items:center}
.searchbox input:focus{outline:2px solid var(--ring);outline-offset:1px;background:var(--surface)}
.searchbox .clear{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;color:var(--ink-3);font-size:16px;line-height:1;
  display:none;place-items:center;
}
.searchbox.filled .clear{display:grid}
.searchbox .clear:hover{background:var(--line);color:var(--ink)}

.tally{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tally b{color:var(--ink);font-weight:600}
.steps{display:flex;gap:6px;flex:none}
.steps button{
  width:34px;height:34px;border:1px solid var(--line);border-radius:50%;
  background:var(--surface);display:grid;place-items:center;font-size:16px;color:var(--ink-2);
  transition:border-color .12s ease,color .12s ease,background .12s ease;
}
.steps button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.steps button:disabled{opacity:.35;cursor:not-allowed}
.ghost{
  flex:none;padding:7px 14px;border:1px solid var(--line);border-radius:var(--radius-pill);
  background:var(--surface);font-size:12px;color:var(--ink-2);
}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- Filterdeck ---------- */
.deck{background:var(--ground);border-bottom:1px solid var(--line)}
.deck.folded .bank{display:none}
.deck.folded .deckfoot{border-top:0}
.summary{
  font-size:11.5px;color:var(--ink-2);display:none;align-items:center;gap:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.deck.folded .summary{display:flex}
.summary b{color:var(--accent);font-weight:600}
.filtertoggle{display:inline-flex;align-items:center;gap:7px}
.filtertoggle .chev{transition:transform .16s ease;font-size:9px;opacity:.7}
.filtertoggle[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.filtertoggle .dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);display:none;
}
.filtertoggle.active .dot{display:block}
.bank{
  display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:start;
  padding:8px 22px;
}
.bank + .bank{border-top:1px dashed var(--line)}
.bank > .key{
  font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding-top:7px;
}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.pill{
  padding:5px 13px;border:1px solid var(--line);border-radius:var(--radius-pill);
  background:var(--surface);font-size:12.5px;color:var(--ink-2);white-space:nowrap;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;
}
.pill .n{opacity:.55;font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"] .n{opacity:.75}
.pill.all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* Aufgaben, die es in der aktuellen Regelauswahl nicht gibt, verschwinden */
.pill.out{display:none}

.pill.flagpill{color:var(--bad);border-color:var(--bad-line)}
.pill.flagpill[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#FFFFFF}

.deckfoot{display:flex;align-items:center;gap:12px;padding:8px 22px;border-top:1px dashed var(--line)}
.hint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-left:auto}
.kbd{
  font-family:source-code-pro,Menlo,monospace;font-size:10px;color:var(--ink-2);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:2px 6px;background:var(--surface);
}
.linkbtn{font-size:11px;color:var(--ink-2);border-bottom:1px solid var(--line-strong);padding-bottom:1px}
.linkbtn:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- Körper ---------- */
.body{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:0}

/* ---------- Liste ---------- */
.listwrap{
  min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;
  background:var(--surface);border-right:1px solid var(--line);
}
.lesson-head{
  position:sticky;top:0;z-index:1;padding:7px 18px 5px;background:var(--surface-2);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  display:flex;justify-content:space-between;
}
.row{
  display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:center;
  width:100%;padding:7px 18px;text-align:left;border-bottom:1px solid var(--line);
}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .rid{font-size:11px;color:var(--ink-3)}
.row[aria-current="true"] .rid,.row[aria-current="true"] .rtx{color:var(--accent)}
:root[data-theme="dark"] .row[aria-current="true"] .rtx,
:root[data-theme="dark"] .row[aria-current="true"] .rid{color:var(--ink)}
.row .rtx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;line-height:1.6}
.row .rtx.placeholder{font-family:inherit;font-size:12px;color:var(--ink-3);direction:ltr}
.row .flag{color:var(--bad-line);font-size:11px;font-weight:700}
.empty{padding:28px 18px;color:var(--ink-3);font-size:13px}

/* ---------- Detail ---------- */
.main{min-height:0;overflow-y:auto}
.sheet{width:100%;max-width:800px;margin:0 auto;padding:26px 24px 80px;display:flex;flex-direction:column;gap:22px}
@media (prefers-reduced-motion:no-preference){
  .sheet > *{animation:rise .22s ease both}
  .sheet > *:nth-child(2){animation-delay:.03s}
  .sheet > *:nth-child(3){animation-delay:.06s}
  .sheet > *:nth-child(4){animation-delay:.09s}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}

.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{
  font-family:source-code-pro,Menlo,monospace;font-size:11px;padding:3px 10px;
  border:1px solid var(--line);border-radius:var(--radius-pill);color:var(--ink-2);background:var(--surface);
}
.chip.rule{border-color:var(--gold);color:var(--ink);background:var(--gold-soft);font-weight:600}
.chip.id{font-weight:600;color:var(--ink);border-color:var(--line-strong)}
.chip.warn{border-color:var(--bad-line);color:var(--bad);background:var(--bad-bg);font-weight:600}

.q{font-size:19px;line-height:1.45;font-weight:600;letter-spacing:-.005em;text-wrap:balance;margin:0}
.q .pat{
  font-family:'Hafs','Amiri',serif;font-size:27px;line-height:1.25;color:var(--accent);
  background:var(--accent-soft);border-radius:8px;padding:2px 9px;display:inline-block;vertical-align:-4px;
}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px;position:relative}
.stage .cap{position:absolute;top:-8px;right:18px;background:var(--surface);padding:0 8px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.subject{font-size:38px;line-height:2;text-align:center;margin:0}
.subject.verse{font-size:31px;line-height:2.15;text-align:right}
.stage.empty-stage{padding:16px 20px;text-align:center;color:var(--ink-3);font-size:13px;box-shadow:none;border-style:dashed;background:var(--surface-3)}
mark.hit{background:var(--mark-bg);color:var(--mark);border-radius:8px;padding:2px 6px;box-shadow:inset 0 -2px 0 var(--mark-line)}
.musterline{color:var(--ink-3);display:flex;align-items:center;gap:6px;flex:1;justify-content:center}
.musterline .pat{font-size:15px}
.sourceline{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--ink-3)}

.sect{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sect h3{margin:0;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sect .hr{flex:1;height:1px;background:var(--line)}
.sect .note{font-size:11px;color:var(--ink-3)}

.opts{display:grid;gap:8px}
.opts.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt.wide{grid-column:1/-1}
.opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius-input);background:var(--surface);min-width:0}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg);box-shadow:inset 3px 0 0 var(--ok-line)}
.opt .oid{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:source-code-pro,Menlo,monospace;font-size:10px;color:var(--ink-3)}
.opt.correct .oid{border-color:var(--ok-line);background:var(--ok-line);color:#FFFFFF;font-weight:600}
.opt .otx{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.opt.correct .otx:not(.arabic):not(.glyph){color:var(--ok)}
.opt .otx.arabic{font-family:'Hafs','Amiri',serif;font-size:24px;line-height:1.6;direction:rtl;text-align:right}
.opt .otx.glyph{font-family:'Hafs','Amiri',serif;font-size:30px;line-height:1.2;direction:rtl}
.opt .gloss{font-size:11px;color:var(--ink-3);display:block;line-height:1.4;direction:ltr;text-align:left;font-family:inherit;font-weight:400}
.opt.correct .gloss{color:var(--ok)}
.opt .tick{flex:none;font-size:11px;font-weight:700;color:var(--ok);letter-spacing:.03em}

.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--ok-line);border-radius:var(--radius-input);background:var(--ok-bg)}
.pair .arrow{text-align:center;color:var(--ok);font-size:14px}
.pair .side{font-family:'Hafs','Amiri',serif;font-size:23px;direction:rtl;text-align:right;line-height:1.6;min-width:0;color:var(--ink)}
.pair .side.opt-side{text-align:left;direction:rtl;color:var(--ok);font-weight:700}
.pair.unused{border-color:var(--line);background:var(--surface)}
.pair.unused .arrow{color:var(--ink-3)}
.pair.unused .side.opt-side{color:var(--ink-2)}

.spans{display:flex;flex-wrap:wrap;gap:7px}
.span-chip{font-family:'Hafs','Amiri',serif;font-size:22px;direction:rtl;line-height:1.5;padding:4px 13px;border:1px solid var(--ok-line);border-radius:var(--radius-input);background:var(--ok-bg);color:var(--ok)}

.aud{display:inline-flex;align-items:center;gap:5px;flex:none;font-family:source-code-pro,Menlo,monospace;font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:var(--radius-pill);padding:3px 10px;background:var(--surface-2)}
.aud:hover{color:var(--accent);border-color:var(--accent)}
.aud[data-state="missing"]{color:var(--ink-3);border-style:dashed;text-decoration:line-through}
.aud[data-state="playing"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border:1px solid var(--bad-line);border-radius:var(--radius-input);background:var(--bad-bg);color:var(--bad);font-size:13px}
.banner b{font-weight:700}
.nothing{padding:60px 24px;text-align:center;color:var(--ink-3)}

@media (max-width:1000px){
  .body{grid-template-columns:1fr}
  .listwrap{max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}
  .bank{grid-template-columns:1fr;gap:5px;padding:8px 16px}
  .bank > .key{padding-top:0}
  .head{flex-wrap:wrap;padding:10px 16px}
  .searchbox{max-width:none;order:3;flex-basis:100%}
  .subject{font-size:30px}
  .subject.verse{font-size:25px}
  .opt.wide{grid-column:1/-1}
  .opts.cols3,.opts.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="app">

  <header class="head">
    <div class="mark">
      <span class="glyph">تجويد</span>
      <h1>Aufgabenbrowser</h1>
    </div>
    <div class="searchbox" id="searchbox">
      <input type="search" id="q" placeholder="Suchen: ID, arabischer Text, Muster, Fragetyp …" autocomplete="off" spellcheck="false">
      <button class="clear" id="q-clear" type="button" title="Suche leeren" aria-label="Suche leeren">×</button>
    </div>
    <span class="tally" id="tally">&ndash;</span>
    <div class="steps">
      <button type="button" id="prev" title="Vorherige Aufgabe (Pfeil links oder hoch)" aria-label="Vorherige Aufgabe">‹</button>
      <button type="button" id="next" title="Nächste Aufgabe (Pfeil rechts oder runter)" aria-label="Nächste Aufgabe">›</button>
    </div>
    <button class="ghost filtertoggle" type="button" id="deck-toggle" aria-expanded="true" aria-controls="deck">
      <span class="dot"></span>Filter<span class="chev">▼</span>
    </button>
    <a class="ghost" href="../" title="Zur Vorschau, wie die Aufgaben in der App aussehen">App-Vorschau</a>
    <button class="ghost" type="button" id="theme" title="Zwischen hell und dunkel wechseln">Dunkel</button>
  </header>

  <div class="deck" id="deck">
    <div class="bank">
      <span class="key">Regel</span>
      <div class="pills" id="bank-rule"></div>
    </div>
    <div class="bank">
      <span class="key">Aufgabe</span>
      <div class="pills" id="bank-task"></div>
    </div>
    <div class="deckfoot">
      <button class="pill flagpill" type="button" id="flag" aria-pressed="false">Nur Auffälligkeiten <span class="n" id="flag-n"></span></button>
      <button class="linkbtn" type="button" id="reset">alles zurücksetzen</button>
      <span class="summary" id="summary"></span>
      <span class="hint">
        <span class="kbd">←</span><span class="kbd">↑</span>&nbsp;zurück
        <span class="kbd">→</span><span class="kbd">↓</span>&nbsp;weiter
        <span class="kbd">/</span>&nbsp;suchen
        <span class="kbd">f</span>&nbsp;Filter
      </span>
    </div>
  </div>

  <div class="body">
    <div class="listwrap" id="list"></div>
    <main class="main" id="main"><div class="sheet" id="sheet"></div></main>
  </div>

</div>

<script>
/* ============================================================

const ID_COUNT = new Map();

function issues(x){
  const out = [];
  /* Bei einer Markieraufgabe heißt die leere Liste „kommt nicht vor“ —
     das ist eine Antwort, keine Lücke. */
  if ((!x.answer || !x.answer.length) && x.task_type !== "mark_verse")
    out.push("kein Antwortschlüssel");
  if (ID_COUNT.get(x.id) > 1) out.push("doppelte ID");
  const shape = (x.options || []).map(o => o.text).join("|");
  if (shape === "Ja|Nein" && x.question_type !== "has_rule")
    out.push("Ja/Nein-Optionen bei „" + x.question_type + "“");
  /* Jede Stelle muss auf ihren Text passen — sonst färbt die Seite daneben. */
  const traeger = [x.subject].concat(x.options || [], x.items || []);
  for (const o of traeger){
    if (!o || !o.spots) continue;
    for (const sp of o.spots)
      if (String(o.text).slice(sp.start, sp.end) !== sp.text){
        out.push("Stelle passt nicht zum Text");
        break;
      }
  }
  return out;
}
DATA.forEach(x => { x._iss = issues(x); });

/* ---------- Hilfen ---------- */
/* Harakat, hochgestelltes Alif und die quranischen Annotationszeichen (Waqf) */
const COMBINING = /[ؐ-ًؚ-ٰٟۖ-ۭ]/;
const isCombining = c => COMBINING.test(c);
const hasArabic   = s => /[؀-ۿ]/.test(s || "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el  = (t, cls, html) => { const n = document.createElement(t); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const ruleName = r => (RULE[r] || {de:r}).de;

/* Alleinstehende Vokalzeichen brauchen einen Trägerkreis, sonst kleben sie am Rand. */
function displayGlyph(text){
  if (text && text.length <= 2 && [...text].every(isCombining)) return "◌" + text;
  return text;
}
function glossFor(text){
  if (!text) return null;
  const bare = [...text].filter(isCombining).join("");
  if (bare && bare.length === text.length) return [...bare].map(c => HARAKA[c]).filter(Boolean).join(" + ") || null;
  if (WAQF_LETTER[text]) return WAQF_LETTER[text];
  if (WAQF_SIGN[text]) return WAQF_SIGN[text];
  return null;
}
/* Indische Ziffern am Wortende sind Versnummern, keine Ziffern im Wort:
   U+06DD davor setzt sie in die verzierte Kartusche, davor ein Leerzeichen. */
const AYAH_TAIL = /[\u0660-\u0669\u06F0-\u06F9]+$/;
function ayahSplit(text){
  const s = String(text == null ? "" : text);
  const m = s.match(AYAH_TAIL);
  if (!m) return [s, ""];
  const stem = s.slice(0, m.index).replace(/[\s\u00A0]+$/, "");
  return [stem, ' <span class="ayah">\u06DD' + esc(m[0]) + '</span>'];
}
function ayahHTML(text){
  const [stem, mark] = ayahSplit(text);
  return esc(stem) + mark;
}
function patternHTML(p){
  if (!p) return "";
  return p.split(":").map(s => `<span class="pat ar">${esc(displayGlyph(s))}</span>`).join(' <span style="color:var(--ink-3);font-weight:400">/</span> ');
}

/* ---------- Fragetext ---------- */
/* Beim Madd fragt der Kurs nicht nach dem natürlichen Langvokal — der gehört
   zum normalen Lesen —, sondern nach der Dehnung darüber hinaus. */
function maddQuestion(x){
  const woerter = (((x.subject && x.subject.text) || "").trim().split(/\s+/) || []).length;
  switch (x.question_type){
    case "has_rule":
      return woerter > 1
        ? "Enthalten diese W\u00f6rter eine Dehnung, die l\u00e4nger als zwei Einheiten ist?"
        : "Enth\u00e4lt dieses Wort eine Dehnung, die l\u00e4nger als zwei Einheiten ist?";
    case "count_rule":
      return "Wie oft kommt eine Dehnung vor, die l\u00e4nger als zwei Einheiten ist?";
    case "match_rule":
      return "Welche W\u00f6rter enthalten eine Dehnung, die l\u00e4nger als zwei Einheiten ist?";
    case "mark_rule_in_verse":
      return "Markiere jede Stelle im Vers, an der l\u00e4nger als zwei Einheiten gedehnt wird.";
    default:
      return null;
  }
}
function questionText(x){
  /* Das Muster steht nicht hinter der Frage — es verriete einen Teil der
     Antwort. Es erscheint unter dem Vers, neben Sure und Ton. Wo ein
     Halt-Zeichen die Frage überhaupt erst bestimmt, steht es im Satz. */
  const R = ruleName(x.rule), p = x.pattern;
  if (x.rule === "madd"){
    const q = maddQuestion(x);
    if (q) return q;
  }
  switch (x.question_type){
    case "has_rule":              return `Enthält dieses Wort ein ${R}?`;
    case "count_rule":            return `Wie oft kommt ${R} vor?`;
    case "match_rule": {
      /* Mit Vorgabewort ist die Verbindung gemeint, ohne es das Wort für sich. */
      const vorgabe = (x.subject && x.subject.text) || "";
      return vorgabe && vorgabe !== "اختر"
        ? `Welche der folgenden Wörter bilden mit diesem ein ${R}?`
        : `Markiere alle Wörter mit ${R}. <span style="color:var(--ink-3);font-weight:400">(Mehrfachauswahl möglich)</span>`;
    }
    case "match_pattern":         return `Ordne jedes Wort seinem ${R}-Muster zu.`;
    case "which_letter":          return `Welcher Buchstabe löst das ${R} aus?`;
    case "vowel_before_letter":   return `Welcher Vokal steht vor dem ${R}-Buchstaben?`;
    case "vowels_before_letter":  return `Welche Vokale stehen vor den ${R}-Buchstaben?`;
    case "vowel_on_letter":       return `Welcher Vokal steht auf dem ${R}-Buchstaben?`;
    case "vowels_on_letter":      return `Welche Vokale stehen auf den ${R}-Buchstaben?`;
    case "position_in_word":      return `An welcher Stelle im Wort steht das ${R}?`;
    case "mark_rule_in_verse":    return `Markiere jede Stelle im Vers, an der ${R} vorkommt.`;
    case "identify_waqf_sign":
      return p === "ۛ"
        ? `Muanaqah <span class="pat ar">◌ۛ</span> — an welchem der beiden Wörter darf angehalten werden? <span style="color:var(--ink-3);font-weight:400">(nur an einer der beiden Stellen, nicht an beiden)</span>`
        : `Welches Waqf-Zeichen steht in diesem Vers?`;
    case "mark_waqf_optional":        return `Markiere jedes Wort vor einem freiwilligen Halt ${patternHTML(p)}.`;
    case "mark_waqf_better_continue": return `Markiere jedes Wort, an dem besser weitergelesen wird ${patternHTML(p)}.`;
    case "mark_waqf_better_pause":    return `Markiere jedes Wort, an dem besser angehalten wird ${patternHTML(p)}.`;
    case "mark_waqf_forbidden":       return `Markiere jedes Wort, an dem der Halt verboten ist ${patternHTML(p)}.`;
    case "mark_waqf_mandatory":       return `An welchen Stellen darf man nicht ohne Anhalten weiterlesen?`;
    default:                          return `${TASK[x.task_type] || x.task_type} — ${x.question_type}`;
  }
}

/* ---------- Antwortstellen einfärben ---------- */
/* Jeder Text, an dem eine Regel greift, bringt seine Stellen selbst mit:
   „spots" nennt Zeichenspannen, für die text.slice(start, end) === spot.text
   gilt. Damit färbt die Seite die richtige Antwort im Wort oder im Vers ein,
   ohne sie erneut herzuleiten. */
function spotHTML(text, spots){
  const parts = ayahSplit(text), stem = parts[0], ayah = parts[1];
  if (!spots || !spots.length) return esc(stem) + ayah;
  let out = "", cur = 0;
  for (const s of spots){
    const a = Math.max(cur, Math.min(s.start, stem.length));
    const b = Math.min(s.end, stem.length);
    if (b <= a) continue;
    out += esc(stem.slice(cur, a)) + '<mark class="hit">' + esc(stem.slice(a, b)) + '</mark>';
    cur = b;
  }
  return out + esc(stem.slice(cur)) + ayah;
}

/* ---------- Audio (optional: Ordner "audio/" neben dieser Datei) ---------- */
let playing = null;
function audioChip(file){
  if (!file) return null;
  const b = el("button", "aud", `<span aria-hidden="true">▸</span>${esc(file)}`);
  b.type = "button";
  b.title = "Abspielen (erwartet audio/" + file + ")";
  b.addEventListener("click", () => {
    if (playing){ playing.el.pause(); playing.chip.dataset.state = ""; }
    const a = new Audio("audio/" + file);
    playing = {el:a, chip:b};
    b.dataset.state = "playing";
    a.addEventListener("error", () => { b.dataset.state = "missing"; b.title = "Datei nicht gefunden: audio/" + file; });
    a.addEventListener("ended", () => { b.dataset.state = ""; });
    a.play().catch(() => { b.dataset.state = "missing"; });
  });
  return b;
}

/* ---------- Bausteine ---------- */
function sectionEl(title, note){
  const s = el("div");
  const h = el("div", "sect");
  h.append(el("h3", null, esc(title)), el("div", "hr"));
  if (note) h.append(el("span", "note", esc(note)));
  s.append(h);
  return s;
}

function optionsEl(x){
  const correct = new Set(x.answer.filter(a => typeof a === "number"));
  /* „kommt nicht vor" steht über die volle Breite und bestimmt das
     Raster der übrigen Antworten nicht mit. */
  const texts = x.options.filter(o => o.text !== "none").map(o => o.text);
  const allShort = texts.every(t => (t || "").length <= 3);
  const anyAudio = x.options.some(o => o.audio);
  const cols = anyAudio ? 1 : (allShort ? Math.min(4, texts.length) : (texts.every(t => (t || "").length <= 14) ? 2 : 1));

  const wrap = el("div", "opts cols" + cols);
  x.options.forEach(o => {
    const row = el("div", "opt" + (o.text === "none" ? " wide" : "")
                              + (correct.has(o.id) ? " correct" : ""));
    row.append(el("span", "oid", String(o.id)));

    const raw = o.text ?? "";
    /* „none“ heißt bei der Auswahl aus Wörtern etwas anderes als beim Zählen. */
    const label = raw !== "none" ? (OPT_DE[raw] || null)
      : x.question_type === "identify_waqf_sign" ? "keines von beiden"
      : (x.task_type === "match" || x.task_type === "matching") ? "keines der Wörter"
      : OPT_DE.none;
    const gloss = glossFor(raw);
    const isGlyph = !label && raw.length <= 2 && [...raw].every(isCombining);
    const arabic = !label && !isGlyph && hasArabic(raw);

    const tx = el("div", "otx" + (isGlyph ? " glyph" : arabic ? " arabic" : ""));
    if (label) tx.textContent = label;
    else if (o.spots && o.spots.length) tx.innerHTML = spotHTML(raw, o.spots);
    else tx.innerHTML = ayahHTML(displayGlyph(raw));
    if (gloss) tx.append(el("span", "gloss", esc(gloss)));
    row.append(tx);

    const a = audioChip(o.audio);
    if (a) row.append(a);
    if (correct.has(o.id)) row.append(el("span", "tick", "richtig"));
    wrap.append(row);
  });
  return wrap;
}

function matchingEl(x){
  const wrap = el("div", "pairs");
  const byId = Object.fromEntries((x.options || []).map(o => [o.id, o]));
  const itemById = Object.fromEntries((x.items || []).map(i => [i.id, i]));
  const usedOpts = new Set();
  (x.answer || []).forEach(pair => {
    const it = itemById[pair.item], op = byId[pair.option];
    usedOpts.add(pair.option);
    const row = el("div", "pair");
    const left = el("div", "side");
    left.innerHTML = it && it.spots && it.spots.length
      ? spotHTML(it.text, it.spots)
      : ayahHTML((it && it.text) || "?");
    const a = it && audioChip(it.audio);
    if (a){ const box = el("div"); box.style.cssText = "display:flex;flex-direction:column;gap:5px;align-items:flex-end;min-width:0"; box.append(left, a); row.append(box); }
    else row.append(left);
    row.append(el("div", "arrow", "→"));
    const right = el("div", "side opt-side");
    right.innerHTML = ayahHTML(displayGlyph((op && op.text) || "?"));
    row.append(right);
    wrap.append(row);
  });
  (x.options || []).filter(o => !usedOpts.has(o.id)).forEach(o => {
    const row = el("div", "pair unused");
    row.append(el("div", "side", '<span style="font-family:inherit;font-size:12px;color:var(--ink-3);direction:ltr;display:block;text-align:left">keinem Wort zugeordnet</span>'));
    row.append(el("div", "arrow", "→"));
    const right = el("div", "side opt-side");
    right.textContent = displayGlyph(o.text);
    row.append(right);
    wrap.append(row);
  });
  return wrap;
}

/* ---------- Detailansicht ---------- */
function render(x){
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = "";
  if (!x){ sheet.append(el("div", "nothing", "Keine Aufgabe entspricht den Filtern.")); return; }

  /* Kennzahlen bewusst weggelassen: die ID steht in der Liste,
     Auffälligkeiten erscheinen unten als Hinweisfeld. */
  const iss = x._iss;

  sheet.append(el("h2", "q", questionText(x)));

  if (iss.length){
    const detail = iss.includes("doppelte ID")
      ? " Dieselbe ID kommt in mehr als einer Datei vor."
      : iss.includes("kein Antwortschlüssel")
        ? " Zu dieser Aufgabe ist keine richtige Antwort hinterlegt."
        : iss.includes("Stelle passt nicht zum Text")
          ? " Eine markierte Stelle stimmt nicht mit dem Text überein."
          : " Optionen und Fragetyp passen nicht zusammen.";
    sheet.append(el("div", "banner",
      "<b>Auffälligkeit im Datensatz:</b>&nbsp;" + iss.map(esc).join(" · ") + "." + detail));
  }

  const subj = x.subject && x.subject.text;
  const isVerse = x.task_type === "mark_verse" || (subj && ayahSplit(subj)[0].trim().split(/\s+/).length > 3);
  const isPrompt = subj === "اختر";
  if (subj && !isPrompt){
    const stage = el("div", "stage");
    stage.append(el("span", "cap", isVerse ? "Vers" : "Wort"));
    const p = el("p", "subject ar" + (isVerse ? " verse" : ""));
    p.innerHTML = spotHTML(subj, x.subject.spots);
    stage.append(p);
    const foot = el("div", "sourceline");
    foot.append(el("span", null, x.sura ? `Sure ${x.sura} : ${x.verse}` : "Einzelwort"));
    if (x.pattern) foot.append(el("span", "musterline", "Muster " + patternHTML(x.pattern)));
    const a = audioChip(x.subject.audio);
    foot.append(a || el("span", "mono", "kein Audio"));
    stage.append(foot);
    sheet.append(stage);
  } else if (x.task_type === "matching" || isPrompt){
    const stage = el("div", "stage empty-stage");
    stage.textContent = isPrompt ? "Reine Auswahlaufgabe — kein Vorgabewort, die Optionen tragen den Inhalt."
                                 : "Reine Zuordnungsaufgabe — kein Vorgabewort.";
    sheet.append(stage);
  }

  if (x.task_type === "matching"){
    const s = sectionEl("Richtige Zuordnung", `Wort → Muster · ${(x.answer || []).length} Paare`);
    s.append(matchingEl(x));
    sheet.append(s);
  } else if (x.task_type === "mark_verse"){
    const n = (x.answer || []).length;
    const s = sectionEl("Zu markierende Stellen",
      n ? `${n} ${n === 1 ? "Stelle" : "Stellen"}` : "1 richtige Antwort");
    if (n){
      const spans = el("div", "spans");
      x.answer.forEach(t => { const c = el("span", "span-chip ar"); c.textContent = t; spans.append(c); });
      s.append(spans);
    } else {
      const row = el("div", "opt wide correct");
      row.append(el("div", "otx", "Kommt nicht vor"), el("span", "tick", "richtig"));
      const wrap = el("div", "opts cols1");
      wrap.append(row);
      s.append(wrap);
    }
    sheet.append(s);
  } else if (x.options && x.options.length){
    const n = x.answer.length;
    const s = sectionEl("Antwortmöglichkeiten", n > 1 ? `${n} richtige Antworten` : n === 1 ? "1 richtige Antwort" : "keine hinterlegt");
    s.append(optionsEl(x));
    sheet.append(s);
  }

  document.getElementById("main").scrollTop = 0;
}

/* ============================================================
   Filter: Umschalt-Pillen statt Auswahlfelder — mehrfach wählbar
   ============================================================ */
const $ = id => document.getElementById(id);
const F = {rules:new Set(), tasks:new Set(), flagged:false, q:""};
const S = {items: DATA, index: 0};

const RULES   = [...new Set(DATA.map(x => x.rule))];
const TASKS   = [...new Set(DATA.map(x => x.task_type))];
const countBy = (f, v) => DATA.filter(x => f(x) === v).length;
const toggle  = (set, v) => set.has(v) ? set.delete(v) : set.add(v);

function pill(label, count, cls){
  const b = el("button", "pill" + (cls ? " " + cls : ""));
  b.type = "button";
  b.setAttribute("aria-pressed", "false");
  b.innerHTML = esc(label) + (count != null ? ` <span class="n">${count}</span>` : "");
  return b;
}

function buildBanks(){
  const rb = $("bank-rule");
  const allR = pill("Alle", DATA.length, "all");
  allR.addEventListener("click", () => { F.rules.clear(); sync(); });
  rb.append(allR);
  RULES.forEach(r => {
    const b = pill(ruleName(r), countBy(x => x.rule, r));
    b.dataset.rule = r;
    b.addEventListener("click", () => { toggle(F.rules, r); sync(); });
    rb.append(b);
  });

  const tb = $("bank-task");
  const allT = pill("Alle", DATA.length, "all");
  allT.addEventListener("click", () => { F.tasks.clear(); sync(); });
  tb.append(allT);
  TASKS.forEach(t => {
    const b = pill(TASK[t] || t, countBy(x => x.task_type, t));
    b.dataset.task = t;
    b.addEventListener("click", () => { toggle(F.tasks, t); sync(); });
    tb.append(b);
  });

  $("flag-n").textContent = DATA.filter(x => x._iss.length).length;
}

function matches(x){
  if (F.rules.size   && !F.rules.has(x.rule))      return false;
  if (F.tasks.size   && !F.tasks.has(x.task_type)) return false;
  if (F.flagged      && !x._iss.length)            return false;
  if (F.q){
    const hay = [x.id, x.subject && x.subject.text, x.pattern, x.question_type,
                 x.task_type, x.rule, x.src, ruleName(x.rule)].join(" ").toLowerCase();
    if (!hay.includes(F.q)) return false;
  }
  return true;
}

/* Filterzustand -> Pillen, Liste, Detail */
function sync(keepId){
  document.querySelectorAll("#bank-rule .pill[data-rule]").forEach(b =>
    b.setAttribute("aria-pressed", F.rules.has(b.dataset.rule)));
  /* Aufgabentypen richten sich nach der Regelauswahl: was es dort nicht gibt,
     wird ausgeblendet — und eine bereits gewählte Aufgabe fällt mit heraus. */
  const scope = F.rules.size ? DATA.filter(x => F.rules.has(x.rule)) : DATA;
  const avail = new Map();
  scope.forEach(x => avail.set(x.task_type, (avail.get(x.task_type) || 0) + 1));
  [...F.tasks].forEach(t => { if (!avail.has(t)) F.tasks.delete(t); });
  document.querySelectorAll("#bank-task .pill[data-task]").forEach(b => {
    const n = avail.get(b.dataset.task) || 0;
    b.classList.toggle("out", n === 0);
    b.querySelector(".n").textContent = n;
    b.setAttribute("aria-pressed", F.tasks.has(b.dataset.task));
  });
  document.querySelector("#bank-task .pill.all .n").textContent = scope.length;
  document.querySelector("#bank-rule .pill.all").setAttribute("aria-pressed", !F.rules.size);
  document.querySelector("#bank-task .pill.all").setAttribute("aria-pressed", !F.tasks.size);
  $("flag").setAttribute("aria-pressed", F.flagged);
  $("searchbox").classList.toggle("filled", !!F.q);

  const parts = [];
  if (F.rules.size)   parts.push([...F.rules].map(ruleName).join(", "));
  if (F.tasks.size)   parts.push([...F.tasks].map(t => TASK[t] || t).join(", "));
  if (F.flagged)      parts.push("nur Auffälligkeiten");
  if (F.q)            parts.push('Suche „' + F.q + '“');
  const active = parts.length > 0;
  $("summary").innerHTML = active ? "<b>" + parts.map(esc).join("</b> · <b>") + "</b>" : "keine Filter gesetzt";
  $("deck-toggle").classList.toggle("active", active);

  S.items = DATA.filter(matches);
  const at = keepId != null ? S.items.findIndex(x => x.id === keepId) : -1;
  buildList();
  show(at >= 0 ? at : 0);
}

/* ---------- Liste ---------- */
function buildList(){
  const list = $("list");
  list.innerHTML = "";
  $("tally").innerHTML = `<b>${S.items.length}</b> von ${DATA.length}`;
  if (!S.items.length){ list.append(el("div", "empty", "Keine Treffer.")); return; }

  const frag = document.createDocumentFragment();
  let head = null;
  S.items.forEach((x, i) => {
    const key = x.rule + "|" + x.lesson;
    if (key !== head){
      head = key;
      const h = el("div", "lesson-head");
      h.append(el("span", null, esc(ruleName(x.rule))), el("span", null, "Lektion " + x.lesson));
      frag.append(h);
    }
    const b = el("button", "row");
    b.type = "button";
    b.dataset.i = i;
    b.append(el("span", "rid mono", "#" + x.id));
    const t = (x.subject && x.subject.text) || "";
    const tx = el("span", t ? "rtx ar" : "rtx placeholder");
    if (t) tx.innerHTML = ayahHTML(t);
    else tx.textContent = TASK[x.task_type] || x.task_type;
    b.append(tx);
    if (x._iss.length) b.append(el("span", "flag", "!"));
    frag.append(b);
  });
  list.append(frag);
}

function show(i){
  if (!S.items.length){ render(null); $("prev").disabled = true; $("next").disabled = true; return; }
  S.index = Math.max(0, Math.min(S.items.length - 1, i));
  render(S.items[S.index]);
  document.querySelectorAll('.row[aria-current="true"]').forEach(n => n.removeAttribute("aria-current"));
  const row = document.querySelector('.row[data-i="' + S.index + '"]');
  if (row){
    row.setAttribute("aria-current", "true");
    const w = $("list"), rt = row.offsetTop, rb = rt + row.offsetHeight;
    if (rt < w.scrollTop + 30 || rb > w.scrollTop + w.clientHeight) w.scrollTop = rt - w.clientHeight / 2;
  }
  $("prev").disabled = S.index <= 0;
  $("next").disabled = S.index >= S.items.length - 1;
}
const step = d => show(S.index + d);

/* ---------- Verdrahtung ---------- */
buildBanks();

$("q").addEventListener("input", e => { F.q = e.target.value.trim().toLowerCase(); sync(); });
$("q-clear").addEventListener("click", () => { $("q").value = ""; F.q = ""; sync(); $("q").focus(); });
$("flag").addEventListener("click", () => { F.flagged = !F.flagged; sync(); });
$("reset").addEventListener("click", () => {
  F.rules.clear(); F.tasks.clear();
  F.flagged = false; F.q = ""; $("q").value = "";
  sync();
});
$("list").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (row) show(+row.dataset.i);
});
$("deck-toggle").addEventListener("click", () => {
  const open = $("deck").classList.toggle("folded") === false;
  $("deck-toggle").setAttribute("aria-expanded", open);
});
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  $("theme").textContent = dark ? "Dunkel" : "Hell";
});

/* Tastatur: Pfeil links/hoch zurück, rechts/runter weiter, Bild-Tasten in Zehnerschritten,
   Pos1/Ende an die Ränder, "/" springt in die Suche. */
addEventListener("keydown", e => {
  const inField = e.target instanceof Element && e.target.matches("input, select, textarea");
  if (inField){
    if (e.key === "Escape" || e.key === "Enter") e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key){
    case "ArrowLeft":  case "ArrowUp":   e.preventDefault(); step(-1);  break;
    case "ArrowRight": case "ArrowDown": e.preventDefault(); step(1);   break;
    case "PageUp":                       e.preventDefault(); step(-10); break;
    case "PageDown":                     e.preventDefault(); step(10);  break;
    case "Home":                         e.preventDefault(); show(0);   break;
    case "End":                          e.preventDefault(); show(S.items.length - 1); break;
    case "/":                            e.preventDefault(); $("q").focus(); $("q").select(); break;
    case "f": case "F":                  e.preventDefault(); $("deck-toggle").click(); break;
  }
});

sync();
</script>
